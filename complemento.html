<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complemento de inscrição — Campo de Férias 2026</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Complemento de inscrição para o Campo de Férias 2026 de Canas de Santa Maria.">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f0fdf4;
      color: #1f2937;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 460px;
      background: #fffdf5;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      overflow: hidden;
      text-align: center;
    }

    .top {
      background: linear-gradient(135deg, #3bb273, #1a7a4a);
      padding: 28px 24px 24px;
    }

    .badge {
      display: inline-block;
      background: #ffd93d;
      color: #7a4e00;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 5px 15px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    h1 {
      color: #ffffff;
      font-size: 25px;
      line-height: 1.2;
      margin-bottom: 6px;
    }

    .subtitle {
      color: rgba(255,255,255,0.85);
      font-size: 14px;
    }

    .content {
      padding: 28px 24px 30px;
    }

    p {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    .btn {
      display: inline-block;
      width: 100%;
      background: linear-gradient(135deg, #3bb273, #1a7a4a);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      padding: 14px 18px;
      border-radius: 14px;
    }

    .small {
      display: block;
      margin-top: 16px;
      color: #9ca3af;
      font-size: 12px;
      line-height: 1.5;
    }

    .error {
      display: none;
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
      margin-top: 16px;
    }

    .error.visible {
      display: block;
    }
  </style>

  <script>
    var BASE_URL = "https://script.google.com/macros/s/AKfycbxrYAdTEGR5A8YgnUsMfpydVeKzcQnjZpGachvcSRjz2h-EspFZYJdtD1EcBWEC_3QZ/exec";

    function getToken() {
      return new URLSearchParams(window.location.search).get('token') || '';
    }

    function buildTargetUrl() {
      var token = getToken();

      if (!token) {
        return '';
      }

      return BASE_URL + '?token=' + encodeURIComponent(token);
    }

    window.addEventListener('load', function() {
      var target = buildTargetUrl();
      var btn = document.getElementById('enter-btn');

      if (!target) {
        document.getElementById('error-box').classList.add('visible');
        btn.style.display = 'none';
        return;
      }

      btn.href = target;

      setTimeout(function() {
        window.location.replace(target);
      }, 900);
    });
  </script>
</head>
<body>
  <main class="box">
    <div class="top">
      <div class="badge">Campo de Férias 2026</div>
      <h1>Complemento de inscrição</h1>
      <div class="subtitle">Canas de Santa Maria</div>
    </div>

    <div class="content">
      <p>A redirecionar para o formulário de complemento da inscrição.</p>
      <a class="btn" id="enter-btn" href="#">Abrir formulário</a>
      <span class="small">Se o redirecionamento não acontecer automaticamente, carregue no botão acima.</span>
      <div class="error" id="error-box">
        Link inválido. Falta o código pessoal de acesso.
      </div>
    </div>
  </main>
</body>
</html>
