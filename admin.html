<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso da Organização — Campo de Férias 2026</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Acesso reservado à organização do Campo de Férias 2026 de Canas de Santa Maria.">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f0fdf4;
      color: #1f2937;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 460px;
      background: #fffdf5;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      overflow: hidden;
      text-align: center;
    }

    .top {
      background: linear-gradient(135deg, #3bb273, #1a7a4a);
      padding: 28px 24px 24px;
    }

    .badge {
      display: inline-block;
      background: #ffd93d;
      color: #7a4e00;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 5px 15px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    h1 {
      color: #ffffff;
      font-size: 25px;
      line-height: 1.2;
      margin-bottom: 6px;
    }

    .subtitle {
      color: rgba(255,255,255,0.85);
      font-size: 14px;
    }

    .content {
      padding: 28px 24px 30px;
    }

    p {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    .btn {
      display: inline-block;
      width: 100%;
      background: linear-gradient(135deg, #3bb273, #1a7a4a);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      padding: 14px 18px;
      border-radius: 14px;
    }

    .small {
      display: block;
      margin-top: 16px;
      color: #9ca3af;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>

  <script>
    var ADMIN_URL = "https://script.google.com/macros/s/AKfycby60lETVo0fseceFKxQqDcsJQIpXobbDpI8lSxBkE9OSTI3q1vwIyvixPLH-z30qmxx/exec";

    window.addEventListener('load', function() {
      setTimeout(function() {
        window.location.replace(ADMIN_URL);
      }, 900);
    });
  </script>
</head>
<body>
  <main class="box">
    <div class="top">
      <div class="badge">Campo de Férias 2026</div>
      <h1>Acesso da organização</h1>
      <div class="subtitle">Canas de Santa Maria</div>
    </div>

    <div class="content">
      <p>A redirecionar para o painel seguro de consulta das inscrições.</p>
      <a class="btn" href="https://script.google.com/macros/s/AKfycby60lETVo0fseceFKxQqDcsJQIpXobbDpI8lSxBkE9OSTI3q1vwIyvixPLH-z30qmxx/exec">Entrar no painel</a>
      <span class="small">Se o redirecionamento não acontecer automaticamente, carregue no botão acima.</span>
    </div>
  </main>
</body>
</html>
